<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f28da8">
<title>Tấn Vương | Chọn giao diện</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 15%,#fff7fb 0 15%,transparent 35%),radial-gradient(circle at 85% 80%,#eefcff 0 15%,transparent 38%),linear-gradient(135deg,#ffeaf2,#eef8ff 55%,#effff6);color:#29405a}.chooser{width:min(680px,100%);padding:34px;border:1px solid rgba(255,255,255,.9);border-radius:34px;background:rgba(255,255,255,.86);box-shadow:0 24px 70px rgba(70,83,118,.14);text-align:center}.icon{font-size:48px}.chooser h1{margin:10px 0 8px;font-size:clamp(25px,5vw,38px)}.chooser p{margin:0 auto 26px;max-width:520px;color:#66778b;line-height:1.55}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.option{min-height:150px;border:0;border-radius:26px;padding:22px;cursor:pointer;font:inherit;font-weight:900;font-size:18px;transition:transform .18s,box-shadow .18s}.option span{display:block;font-size:42px;margin-bottom:10px}.pc{background:linear-gradient(145deg,#fff4f8,#ffe2ed);color:#d93f72;box-shadow:0 10px 25px rgba(218,74,119,.10)}.mobile{background:linear-gradient(145deg,#eef7ff,#e2f1ff);color:#2878cf;box-shadow:0 10px 25px rgba(57,126,202,.10)}.option:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(58,76,105,.14)}.note{margin-top:19px;font-size:12px;color:#8b98a8}@media(max-width:560px){.chooser{padding:25px 18px;border-radius:28px}.options{grid-template-columns:1fr}.option{min-height:112px}.option span{font-size:34px}}
</style>
</head>
<body>
<main class="chooser">
<div class="icon">📚</div>
<h1>Chọn giao diện học</h1>
<p>PC và điện thoại đã được tách thành hai luồng riêng. Mỗi phiên bản chỉ tải phần giao diện cần thiết.</p>
<div class="options">
<button class="option pc" data-target="pc.html"><span>🖥️</span>Máy tính</button>
<button class="option mobile" data-target="mobile.html"><span>📱</span>Điện thoại</button>
</div>
<div class="note">Lựa chọn không được lưu. Sau khi chọn, giao diện sẽ được khóa cho phiên hiện tại. Muốn chọn lại, hãy tải lại Trang chủ.</div>
</main>
<script>
document.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>{location.href=b.dataset.target+(location.hash||'')}));
</script>
</body>
</html>
