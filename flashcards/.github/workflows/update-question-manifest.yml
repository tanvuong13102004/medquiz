name: Update question counts

on:
  push:
    paths:
      - "questions/**"
      - "tools/generate-question-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate question counts
        run: node tools/generate-question-manifest.mjs

      - name: Commit updated manifest
        run: |
          if git diff --quiet question-manifest.json; then
            echo "Không có thay đổi số câu."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-manifest.json
          git commit -m "Auto update question counts"
          git push
